apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: flannel-role
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["list", "watch"]
  - apiGroups: [""]
    resources: ["nodes/status"]
    verbs: ["patch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: flannel-role-binding
subjects:
  - kind: User
    name: system:flannel
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: ClusterRole
  name: flannel-role
  apiGroup: rbac.authorization.k8s.io
