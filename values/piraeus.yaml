extraManifests:
  - apiVersion: piraeus.io/v1
    kind: LinstorSatelliteConfiguration
    metadata:
      name: storage-pool
    spec:
      nodeAffinity:
        nodeSelectorTerms:
          - matchExpressions:
              - key: kubernetes.io/hostname
                operator: NotIn
                values:
                  - old-laptop-msi
      storagePools:
        - name: piraeus-pool
          zfsThinPool:
            zPool: tank
      podTemplate:
        spec:
          hostNetwork: true

  - apiVersion: piraeus.io/v1
    kind: LinstorSatelliteConfiguration
    metadata:
      name: storage-pool-old-laptop-msi
    spec:
      nodeSelector:
        kubernetes.io/hostname: old-laptop-msi
      storagePools:
        - name: piraeus-pool
          zfsThinPool:
            zPool: exhdd
      podTemplate:
        spec:
          hostNetwork: true
          containers:
            - name: linstor-satellite
              startupProbe:
                tcpSocket:
                  port: linstor
                periodSeconds: 10
                failureThreshold: 30

  - apiVersion: storage.k8s.io/v1
    kind: StorageClass
    metadata:
      name: replicated-storage
    provisioner: linstor.csi.linbit.com
    allowVolumeExpansion: true
    volumeBindingMode: WaitForFirstConsumer
    parameters:
      linstor.csi.linbit.com/placementCount: "2"
      linstor.csi.linbit.com/storagePool: piraeus-pool
      property.linstor.csi.linbit.com/DrbdOptions/Resource/quorum: "off"

operator:
  securityContext:
    # The linstor-csi-node image tries to create /var/lib/kubernetes, but when /var/lib is read-only, that doesn't work.
    # Probably a bug.
    readOnlyRootFilesystem: false
