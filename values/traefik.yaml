ingressRoute:
  dashboard:
    enabled: true
    matchRule: Host(`traefik.bamilab.space`)
    entryPoints:
      - web
      - websecure

ports:
  web:
    exposedPort: 80
    port: 8000
    nodePort: 32123
  # Port 9100 is already taken by the node exporter on each node's system
  metrics:
    port: 9101
    exposedPort: 9101
    #hostPort: 9101

gateway:
  listeners:
    web:
      port: 80
      hostname: bamilab.space
      namespacePolicy:
        from: All

service:
  spec:
    type: LoadBalancer
    externalIPs:
      - 172.0.0.10
      - 172.0.0.11
      - 172.0.0.12
