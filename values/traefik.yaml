ingressRoute:
  dashboard:
    enabled: true
    matchRule: Host(`traefik.bamilab.space`)
    entryPoints:
      - web
      - websecure

metrics:
  prometheus:
    addRoutersLabels: true

ports:
  web:
    exposedPort: 80
  # Port 9100 is already taken by the node exporter on each node's system
  metrics:
    expose:
      default: true
    exposedPort: 9101

gateway:
  listeners:
    web:
      port: 80
      hostname: bamilab.space
      namespacePolicy:
        from: All

service:
  spec:
    type: LoadBalancer
    externalIPs:
      - 172.0.0.10
      - 172.0.0.11
      - 172.0.0.12
