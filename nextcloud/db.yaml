apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: nextcloud-db
  namespace: default
spec:
  instances: 2

  imageName: ghcr.io/cloudnative-pg/postgresql:17

  bootstrap:
    initdb:
      database: nextcloud
      owner: nextcloud

  storage:
    size: 10Gi
    storageClass: local-path
