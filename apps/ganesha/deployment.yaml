
apiVersion: apps/v1
kind: Deployment
metadata:
  name: main
  namespace: ganesha
  labels:
    app: main
spec:
  selector:
    matchLabels:
      app: main
  template:
    metadata:
      labels:
        app: main
    spec:
      volumes:
        - name: piraeus-volume
          persistentVolumeClaim:
            claimName: nas-folder
      containers:
        - name: app
          image: docker.io/library/ganesha:latest
          imagePullPolicy: Never
          securityContext:
            capabilities:
              add:
                - SYS_RESOURCE
          volumeMounts:
            - name: piraeus-volume
              mountPath: /mnt
              readOnly: true
