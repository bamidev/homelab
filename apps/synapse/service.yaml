apiVersion: v1
kind: Service
metadata:
  name: service
  namespace: synapse
spec:
  type: NodePort
  
  selector:
    app: production
    
  ports:
    - name: http
      port: 7962 # SYNA on T9
      targetPort: 8080
      nodePort: 30005
      protocol: TCP
    - name: exporter
      port: 7963
      targetPort: 9100
      protocol: TCP
