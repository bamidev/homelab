apiVersion: v1
kind: Pod
metadata:
  name: production
  namespace: owncast
  labels:
    app: production
spec:
  containers:
    - name: app
      image: docker.io/library/owncast:latest
      imagePullPolicy: Never
      env:
        - name: ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: credentials
              key: admin-password
