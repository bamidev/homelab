apiVersion: apps/v1
kind: Deployment
metadata:
  name: production
  namespace: owncast
  labels:
    app: production
spec:
  selector:
    matchLabels:
      app: production
  template:
    metadata:
      labels:
        app: production
    spec:
      volumes:
        - name: piraeus-volume
          persistentVolumeClaim:
            claimName: filestore
      containers:
        - name: app
          image: docker.io/library/owncast:latest
          imagePullPolicy: Never
          volumeMounts:
            - name: piraeus-volume
              mountPath: /mnt
          env:
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: credentials
                  key: admin-password
