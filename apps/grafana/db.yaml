apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: production-database
  namespace: grafana
spec:
  instances: 2

  imageName: ghcr.io/cloudnative-pg/postgresql:17

  bootstrap:
    initdb:
      database: grafana
      owner: grafana

  storage:
    size: 10Gi
    storageClass: local-path
