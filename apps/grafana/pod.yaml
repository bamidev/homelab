apiVersion: v1
kind: Pod
metadata:
  name: production
  namespace: grafana
  labels:
    app: production
spec:
  containers:
    - name: app
      image: docker.io/library/grafana:latest
      imagePullPolicy: Never
      env:
        - name: POSTGRES_DB
          value: "grafana"
        - name: POSTGRES_USER
          value: "grafana"
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: production-database-app
              key: password
